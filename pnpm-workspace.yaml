packages:
  - 'apps/*'
  - 'packages/*'

# NOTE: do NOT put onlyBuiltDependencies here — pnpm 11.3 does not read it from
# this file, and declaring it only suppresses pnpm's built-in default allowlist,
# which is what actually lets esbuild/prisma/@nestjs/core run their postinstalls.
# The build-script config lives in package.json under "pnpm" instead.
