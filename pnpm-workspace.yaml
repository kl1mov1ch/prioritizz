packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10+ gates dependency build scripts behind an explicit allowlist.
# `allowBuilds` is not a pnpm key — it was silently ignored, and the packages
# below only ran because they sit on pnpm's built-in default list. Anything off
# that list (e.g. @scarf/scarf) made `pnpm install` exit 1 with
# ERR_PNPM_IGNORED_BUILDS, since there is no TTY to run `pnpm approve-builds`.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma

# Deliberately not built — @scarf/scarf's postinstall is analytics only.
# Listing it here is how pnpm records "yes, skipping this is intentional".
ignoredBuiltDependencies:
  - '@scarf/scarf'
