# Prioritizz — production stack for a single VPS, domain-less HTTPS via sslip.io.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Hostnames (PUBLIC_HOST / ADMIN_HOST) and secrets come from .env in this dir.
name: prioritizz-prod

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prioritizz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prioritizz}
      POSTGRES_DB: prioritizz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prioritizz']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    <<: *restart
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-prioritizz}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-prioritizz}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-prioritizz} ${S3_SECRET_ACCESS_KEY:-prioritizz} &&
      mc mb -p local/${S3_BUCKET:-prioritizz-media} &&
      mc anonymous set download local/${S3_BUCKET:-prioritizz-media};
      exit 0;
      "

  # Applies pending migrations, then exits. api waits for this to finish.
  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      network: host
    image: prioritizz-prod-api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://prioritizz:${POSTGRES_PASSWORD:-prioritizz}@postgres:5432/prioritizz?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      [
        'node',
        'node_modules/prisma/build/index.js',
        'migrate',
        'deploy',
        '--schema',
        'prisma/schema.prisma',
      ]
    restart: 'no'

  api:
    <<: *restart
    image: prioritizz-prod-api
    pull_policy: never
    env_file: [.env]
    environment:
      NODE_ENV: production
      APP_MODE: http
      DATABASE_URL: postgresql://prioritizz:${POSTGRES_PASSWORD:-prioritizz}@postgres:5432/prioritizz?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *restart
    image: prioritizz-prod-api
    pull_policy: never
    env_file: [.env]
    environment:
      NODE_ENV: production
      APP_MODE: worker
      DATABASE_URL: postgresql://prioritizz:${POSTGRES_PASSWORD:-prioritizz}@postgres:5432/prioritizz?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      api:
        condition: service_started

  bot:
    <<: *restart
    build:
      context: .
      dockerfile: infra/docker/bot.Dockerfile
      network: host
    env_file: [.env]
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  webbuild:
    build:
      context: .
      dockerfile: infra/docker/webbuild.Dockerfile
      network: host
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-prioritizz_bot}
    volumes:
      - miniapp_dist:/out/mini-app
      - admin_dist:/out/admin
    restart: 'no'

  caddy:
    <<: *restart
    image: caddy:2-alpine
    depends_on:
      webbuild:
        condition: service_completed_successfully
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@example.com}
    volumes:
      - ./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - miniapp_dist:/srv/mini-app:ro
      - admin_dist:/srv/admin:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  miniodata:
  miniapp_dist:
  admin_dist:
  caddydata:
  caddyconfig:
